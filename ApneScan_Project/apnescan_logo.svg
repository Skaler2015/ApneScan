  <path d="M86 48 v18 h18 z" fill="#cbeee9"/>
  <!-- Text lines on document -->
  <rect x="58" y="74" width="40" height="5" rx="2.5" fill="#0f766e" opacity="0.35"/>
  <rect x="58" y="86" width="40" height="5" rx="2.5" fill="#0f766e" opacity="0.35"/>
  <rect x="58" y="98" width="26" height="5" rx="2.5" fill="#0f766e" opacity="0.35"/>
  <!-- Scan beam -->
  <rect x="40" y="90" width="72" height="8" rx="4" fill="url(#beam)"/>
  <rect x="40" y="92.5" width="72" height="3" rx="1.5" fill="#99f6e4"/>

  <!-- Wordmark -->
  <text x="164" y="98" font-size="58" font-weight="800" letter-spacing="-1">
    <tspan fill="#1f2933">Apne</tspan><tspan fill="#0f766e">Scan</tspan>
