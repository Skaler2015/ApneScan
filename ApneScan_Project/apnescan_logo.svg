      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Icon badge -->
  <rect x="16" y="20" width="120" height="120" rx="28" fill="url(#badge)"/>
  <!-- Document -->
  <path d="M52 48 h34 l18 18 v46 a4 4 0 0 1 -4 4 H52 a4 4 0 0 1 -4 -4 V52 a4 4 0 0 1 4 -4 z"
