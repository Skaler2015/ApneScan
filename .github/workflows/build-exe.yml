name: Build ApneScan EXE

on:
  workflow_dispatch:
  push:
    branches:
      - claude/content-review-jjokt7
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up 32-bit Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86

      - name: Install dependencies
        working-directory: ApneScan_Project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        working-directory: ApneScan_Project
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "ApneScan" --icon apnescan.ico --collect-all win32com --collect-all win32 --hidden-import pythoncom --hidden-import pywintypes apnescan.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApneScan-exe
          path: ApneScan_Project/dist/ApneScan.exe
          if-no-files-found: error

      # Tag push (jaise v16) par exe seedha GitHub Releases page par chala jata
      # hai — public download link, login ki zaroorat nahi.
      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ApneScan_Project/dist/ApneScan.exe
          generate_release_notes: true
