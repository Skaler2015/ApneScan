name: Deploy Website

# Software me koi bhi update push hote hi website apne aap update ho jaati hai
# (version number website par code se nikaal kar daala jata hai).
on:
  workflow_dispatch:
  push:
    branches:
      - claude/content-review-jjokt7
      - main
    paths:
      - 'ApneScan_Project/apnescan_website.html'
      - 'ApneScan_Project/apnescan_logo*'
      - 'ApneScan_Project/apnescan_icon.png'
      - 'ApneScan_Project/apnescan.py'
      - '.github/workflows/deploy-website.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # exe artifact download karne ke liye

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build site (inject current app version)
        run: |
          mkdir -p _site
          VERSION=$(grep -oP 'VERSION = "\K[0-9]+' ApneScan_Project/apnescan.py | head -1)
          echo "App version: v$VERSION"
          sed "s/{{VERSION}}/v$VERSION/g" ApneScan_Project/apnescan_website.html > _site/index.html
          # Extra pages (guides, compare, privacy, about, changelog, tools, faq…)
          for f in ApneScan_Project/website_extras/pages/*.html; do
            [ -e "$f" ] || continue
            sed "s/{{VERSION}}/v$VERSION/g" "$f" > "_site/$(basename "$f")"
          done
          cp ApneScan_Project/apnescan_logo.png _site/ 2>/dev/null || true
          cp ApneScan_Project/apnescan_logo.svg _site/ 2>/dev/null || true
          cp ApneScan_Project/apnescan_icon.png _site/ 2>/dev/null || true
          # Custom subdomain (Hostinger DNS: CNAME apnescan -> skaler2015.github.io)
          echo "apnescan.apnesoft.com" > _site/CNAME
          # App ka in-app update-check isi file se naya version pehchanta hai
          echo "v$VERSION" > _site/version.txt
          # SEO/GEO files: robots.txt (AI crawlers allowed), llms.txt, sitemap
          cp ApneScan_Project/website_extras/robots.txt _site/ 2>/dev/null || true
          cp ApneScan_Project/website_extras/llms.txt _site/ 2>/dev/null || true
          # Google Search Console ownership verification
          cp ApneScan_Project/website_extras/google*.html _site/ 2>/dev/null || true
          TODAY=$(date -u +%Y-%m-%d)
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            echo "  <url><loc>https://apnescan.apnesoft.com/</loc><lastmod>$TODAY</lastmod><priority>1.0</priority></url>"
            for f in _site/*.html; do
              b=$(basename "$f")
              [ "$b" = "index.html" ] && continue
              case "$b" in google*.html) continue;; esac
              echo "  <url><loc>https://apnescan.apnesoft.com/$b</loc><lastmod>$TODAY</lastmod><priority>0.7</priority></url>"
            done
            echo '</urlset>'
          } > _site/sitemap.xml

      # EXE ko seedha website par rakho — "Download" button click karte hi
      # apnescan.apnesoft.com/ApneScan.exe se download shuru ho jata hai.
      # Pehle ISI commit ki exe build ka intezaar karte hain (taaki website
      # aur exe hamesha same version hon); na mile to branch ki sabse nayi
      # successful build ki exe use hoti hai.
      - name: Download latest ApneScan.exe into site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=""
          for i in $(seq 1 25); do
            RUN_ID=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build-exe.yml \
                     --branch "$GITHUB_REF_NAME" --status success \
                     --json databaseId,headSha \
                     -q "[.[] | select(.headSha == \"$GITHUB_SHA\")][0].databaseId")
            [ -n "$RUN_ID" ] && break
            echo "Exe build abhi chal rahi hai... intezaar ($i/25)"
            sleep 20
          done
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build-exe.yml \
                     --branch "$GITHUB_REF_NAME" --status success --limit 1 \
                     --json databaseId -q '.[0].databaseId')
          fi
          echo "Exe build run: $RUN_ID"
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n ApneScan-exe -D _site/
          # Installer bhi website par (na mile to koi baat nahi — purani builds me nahi tha)
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n ApneScan-Setup -D _site/ || true
          ls -la _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
