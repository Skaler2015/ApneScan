name: Deploy Website

# Software me koi bhi update push hote hi website apne aap update ho jaati hai
# (version number website par code se nikaal kar daala jata hai).
on:
  workflow_dispatch:
  push:
    branches:
      - claude/content-review-jjokt7
      - main
    paths:
      - 'ApneScan_Project/apnescan_website.html'
      - 'ApneScan_Project/apnescan_logo*'
      - 'ApneScan_Project/apnescan_icon.png'
      - 'ApneScan_Project/apnescan.py'
      - 'ApneScan_Project/website_extras/**'
      - '.github/workflows/deploy-website.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # exe artifact download karne ke liye

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build site (inject current app version)
        run: |
          mkdir -p _site
          VERSION=$(grep -oP 'VERSION = "\K[0-9]+' ApneScan_Project/apnescan.py | head -1)
          echo "App version: v$VERSION"
          sed "s/{{VERSION}}/v$VERSION/g" ApneScan_Project/apnescan_website.html > _site/index.html
          # Extra pages (guides, compare, privacy, about, changelog, tools, faq…)
          for f in ApneScan_Project/website_extras/pages/*.html; do
            [ -e "$f" ] || continue
            sed "s/{{VERSION}}/v$VERSION/g" "$f" > "_site/$(basename "$f")"
          done
          # Clean URL: apnescan.apnesoft.com/share -> web-share tool (iframe wrapper)
          if [ -f _site/share.html ]; then mkdir -p _site/share && cp _site/share.html _site/share/index.html; fi
          cp ApneScan_Project/apnescan_logo.png _site/ 2>/dev/null || true
          cp ApneScan_Project/apnescan_logo.svg _site/ 2>/dev/null || true
          cp ApneScan_Project/apnescan_icon.png _site/ 2>/dev/null || true
          cp ApneScan_Project/ApneScan_Guide.pdf _site/ 2>/dev/null || true
          # Custom subdomain (Hostinger DNS: CNAME apnescan -> skaler2015.github.io)
          echo "apnescan.apnesoft.com" > _site/CNAME
          # App ka in-app update-check isi file se naya version pehchanta hai
          echo "v$VERSION" > _site/version.txt
          # SEO/GEO/AEO/LLMO files: robots.txt (AI crawlers allowed), llms.txt,
          # llms-full.txt, ai.txt, manifest, humans.txt, security.txt
          cp ApneScan_Project/website_extras/robots.txt _site/ 2>/dev/null || true
          cp ApneScan_Project/website_extras/llms.txt _site/ 2>/dev/null || true
          cp ApneScan_Project/website_extras/llms-full.txt _site/ 2>/dev/null || true
          cp ApneScan_Project/website_extras/ai.txt _site/ 2>/dev/null || true
          cp ApneScan_Project/website_extras/manifest.webmanifest _site/ 2>/dev/null || true
          cp ApneScan_Project/website_extras/humans.txt _site/ 2>/dev/null || true
          mkdir -p _site/.well-known
          cp ApneScan_Project/website_extras/.well-known/security.txt _site/.well-known/ 2>/dev/null || true
          # Google Search Console ownership verification
          cp ApneScan_Project/website_extras/google*.html _site/ 2>/dev/null || true
          TODAY=$(date -u +%Y-%m-%d)
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            echo "  <url><loc>https://apnescan.apnesoft.com/</loc><lastmod>$TODAY</lastmod><priority>1.0</priority></url>"
            for f in _site/*.html; do
              b=$(basename "$f")
              [ "$b" = "index.html" ] && continue
              case "$b" in google*.html) continue;; esac
              echo "  <url><loc>https://apnescan.apnesoft.com/$b</loc><lastmod>$TODAY</lastmod><priority>0.7</priority></url>"
            done
            echo '</urlset>'
          } > _site/sitemap.xml

      # EXE ko seedha website par rakho — "Download" button click karte hi
      # apnescan.apnesoft.com/ApneScan.exe se download shuru ho jata hai.
      # Pehle ISI commit ki exe build ka intezaar karte hain (taaki website
      # aur exe hamesha same version hon); na mile to branch ki sabse nayi
      # successful build ki exe use hoti hai.
      - name: Download ApneScan.exe (GitHub Release) into site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Website ka download exe ab GitHub RELEASE se aata hai (artifact nahi) —
          # Release quota-free + version-matched hai. Isi version ka release banne
          # ka intezaar karte hain (build parallel me chal rahi hoti hai).
          V=$(grep -m1 -oP 'VERSION = "\K[0-9]+' ApneScan_Project/apnescan.py)
          echo "Chahiye version: v$V"
          # (v280) onedir: installer (.exe) + portable folder ka ZIP publish hote
          # hain; standalone ApneScan.exe ab nahi (usko chalane ke liye _internal
          # folder chahiye). Website: main = Setup.exe, portable = Portable.zip.
          for i in $(seq 1 30); do
            if gh release download "v$V" -R "$GITHUB_REPOSITORY" \
                 -p "ApneScan-Setup.exe" -p "ApneScan-Portable.zip" -D _site/ --clobber 2>/dev/null; then
              echo "Release v$V mil gaya"; break
            fi
            echo "Release v$V abhi ban raha hai... intezaar ($i/30)"; sleep 20
          done
          # Na mile to sabse nayi release se (taaki website kabhi khaali na ho)
          if [ ! -f _site/ApneScan-Setup.exe ]; then
            echo "v$V na mila — latest release se le rahe hain"
            gh release download -R "$GITHUB_REPOSITORY" \
              -p "ApneScan-Setup.exe" -p "ApneScan-Portable.zip" -D _site/ --clobber || true
          fi
          # ---- ASLI download data website me daalo (size, SHA-256, date) ----
          # Fake "~15 MB" jaisi ginti nahi — jo exe deploy ho rahi hai usi ke
          # asli numbers har page me inject hote hain.
          SETUPMB="?" ; SHA="checksum unavailable" ; RDATE=$(date -u +"%d %b %Y")
          if [ -f _site/ApneScan-Setup.exe ]; then
            SETUPMB=$(awk "BEGIN{printf \"%.1f\", $(stat -c%s _site/ApneScan-Setup.exe)/1048576}")
            SHA=$(sha256sum _site/ApneScan-Setup.exe | cut -d' ' -f1)
          fi
          PDATE=$(gh release view "v$V" -R "$GITHUB_REPOSITORY" --json publishedAt -q .publishedAt 2>/dev/null || true)
          if [ -n "$PDATE" ]; then RDATE=$(date -u -d "$PDATE" +"%d %b %Y" 2>/dev/null || echo "$RDATE"); fi
          echo "Real data: ${SETUPMB} MB | $RDATE | sha256=$SHA"
          for f in _site/*.html; do
            sed -i "s/{{SETUPMB}}/$SETUPMB/g; s/{{RELDATE}}/$RDATE/g; s/{{SHA256}}/$SHA/g" "$f"
          done
          ls -la _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
